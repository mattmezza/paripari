name: Release

on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # CI runs on pull requests only, so this is the last gate before an image
      # ships: a tag cut from a broken tree must not reach the registry.
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go vet ./...
        working-directory: app
      - run: go test ./...
        working-directory: app
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ghcr.io/mattmezza/paripari:${{ github.event.release.tag_name }}
            ghcr.io/mattmezza/paripari:latest
