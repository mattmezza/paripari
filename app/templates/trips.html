{{define "content"}}
{{$d := .Data}}
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-block-end:1rem">
  <h1 style="margin:0">Trips</h1>
</div>

<div class="card" style="margin-block-end:1rem">
  <div class="card__head"><h3 class="card__title">Plan a trip</h3></div>
  <form hx-post="/trips" style="display:flex;gap:.625rem;flex-wrap:wrap;align-items:flex-end">
    <div class="field" style="flex:2;min-width:12rem">
      <label class="label" for="new-trip-name">Name</label>
      <input class="input" id="new-trip-name" name="name" placeholder="e.g. Portugal, October" required>
    </div>
    <div class="field" style="flex:1;min-width:10rem">
      <label class="label" for="new-trip-date">Start date</label>
      <input class="input" id="new-trip-date" name="start_date" type="date">
    </div>
    <button class="btn btn--primary" type="submit">Create</button>
  </form>
</div>

{{if not $d.Trips}}
<div class="card"><p class="auth__meta" style="margin:0">No trips yet. Itemize one and see the impact on your goals.</p></div>
{{end}}

<div style="display:grid;gap:.75rem">
  {{range $d.Trips}}
  <a class="card" href="/trips/{{.ID}}" style="display:block;text-decoration:none;color:inherit">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
      <div>
        <h3 class="card__title" style="margin:0">{{.Name}}</h3>
        <p class="auth__meta" style="margin:.25rem 0 0">{{if .StartDateText}}{{.StartDateText}} · {{end}}{{.TotalText}}</p>
      </div>
      <span class="pill {{if eq .Status "committed"}}pill--positive{{end}}">{{.Status}}</span>
    </div>
  </a>
  {{end}}
</div>
{{end}}
