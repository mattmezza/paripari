{{define "content"}}
{{$d := .Data}}
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-block-end:1rem">
  <h1 style="margin:0">Scenarios</h1>
</div>

<div class="card" style="margin-block-end:1rem">
  <div class="card__head"><h3 class="card__title">New scenario</h3></div>
  <form hx-post="/scenarios" style="display:flex;gap:.625rem;flex-wrap:wrap;align-items:flex-end">
    <div class="field" style="flex:1;min-width:12rem">
      <label class="label" for="new-scenario-name">Name</label>
      <input class="input" id="new-scenario-name" name="name" placeholder="e.g. Raise + bigger flat" required>
    </div>
    <button class="btn btn--primary" type="submit">Create</button>
  </form>
</div>

{{if not $d.Cards}}
<div class="card"><p class="auth__meta" style="margin:0">No scenarios yet. Stack a few changes above and see the cascade.</p></div>
{{end}}

<div style="display:grid;gap:.75rem">
  {{range $d.Cards}}
  <a class="card" href="/scenarios/{{.ID}}" style="display:block;text-decoration:none;color:inherit">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
      <div>
        <h3 class="card__title" style="margin:0">{{.Name}}</h3>
        <p class="auth__meta" style="margin:.25rem 0 0">{{.ChangeCount}} change{{if ne .ChangeCount 1}}s{{end}}</p>
      </div>
      <span class="pill {{if eq .DeltaTone "positive"}}pill--positive{{else if eq .DeltaTone "danger"}}pill--danger{{end}}" data-tick>{{.DeltaText}}</span>
    </div>
  </a>
  {{end}}
</div>
{{end}}
